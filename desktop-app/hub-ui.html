<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ALS Server Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-weight: 600; font-size: 24px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .card { background: #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        .form-group input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        button:hover { background: #2563eb; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        .account-list { display: flex; flex-direction: column; gap: 15px; }
        .account-item { background: #333; padding: 15px; border-radius: 6px; border: 1px solid #444; }
        .account-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .account-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; color: #bbb; background: #222; padding: 10px; border-radius: 4px; }
        .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #555; color: white; margin-left: 10px; }
        .status-online { background: #10b981; }
        .status-offline { background: #ef4444; }
        .logs-box { margin-top: 10px; background: #1a1a1a; padding: 10px; border-radius: 4px; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #888; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab { padding: 10px 20px; cursor: pointer; color: #888; font-weight: 500; }
        .tab.active { color: #fff; border-bottom: 2px solid #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; align-items: baseline; gap: 15px;">
            <h1>ALS Server Hub</h1>
            <span style="background: #3b82f6; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #fff;">v1.5.4</span>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('accounts')">Accounts</div>
            <div class="tab" onclick="switchTab('add')">Add Account</div>
            <div class="tab" onclick="switchTab('settings')">Global Settings</div>
        </div>

        <div id="accounts" class="tab-content active">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="margin: 0;">Managed Accounts</h2>
                    <button onclick="loadAccounts()" style="background: #444;">Refresh Status</button>
                </div>
                <div class="account-list" id="accountList">
                    <!-- Accounts injected here -->
                </div>
            </div>
        </div>

        <div id="add" class="tab-content">
            <div class="card">
                <h2>Add New Account</h2>
                <div class="form-group">
                    <label>Device ID</label>
                    <input type="text" id="deviceId" placeholder="e.g. user_office_pc">
                </div>
                <div class="form-group">
                    <label>UPM Username</label>
                    <input type="text" id="upmUsername">
                </div>
                <div class="form-group">
                    <label>UPM Password</label>
                    <input type="password" id="upmPassword">
                </div>
                <div class="form-group">
                    <label>Supabase Email</label>
                    <input type="email" id="supabaseEmail">
                </div>
                <div class="form-group">
                    <label>Supabase Password</label>
                    <input type="password" id="supabasePassword">
                </div>
                <button onclick="saveAccount()">Save Account</button>
            </div>
        </div>

        <div id="settings" class="tab-content">
            <div class="card">
                <h2>Global Database Settings</h2>
                <div class="form-group">
                    <label>Supabase URL</label>
                    <input type="text" id="supabaseUrl">
                </div>
                <div class="form-group">
                    <label>Supabase Anon Key</label>
                    <input type="password" id="supabaseKey">
                </div>
                <button onclick="saveGlobalSettings()">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tabBtn = document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`);
            if (tabBtn) tabBtn.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            if (tabId === 'accounts') loadAccounts();
        }

        async function loadAccounts() {
            if (!window.electronAPI) return;
            const accounts = await window.electronAPI.getHubAccounts();
            const list = document.getElementById('accountList');
            list.innerHTML = '';
            
            if (accounts.length === 0) {
                list.innerHTML = '<div style="color:#888;">No accounts configured.</div>';
                return;
            }

            for (const acc of accounts) {
                const data = await window.electronAPI.getHubAccountStatus(acc.device_id);
                const isOnline = data.status && data.status.current_status && data.status.current_status.includes('ONLINE');
                const badgeClass = isOnline ? 'status-online' : 'status-offline';
                const statusText = data.status ? data.status.current_status : 'UNKNOWN';
                
                let proofText = 'No proof today';
                if (data.proof) {
                    proofText = `IN: ${data.proof.clock_in || '--:--'} | OUT: ${data.proof.clock_out || '--:--'}`;
                }

                let logsHtml = '';
                if (data.logs && data.logs.length > 0) {
                    logsHtml = data.logs.map(log => `<div>[${new Date(log.created_at).toLocaleString()}] [${log.status}] ${log.message}</div>`).join('');
                } else {
                    logsHtml = '<div>No recent logs found.</div>';
                }

                list.innerHTML += `
                    <div class="account-item">
                        <div class="account-header">
                            <div>
                                <strong>${acc.device_id}</strong>
                                <span class="status-badge ${badgeClass}">${statusText}</span><br>
                                <small style="color:#aaa;">${acc.supabase_email}</small>
                            </div>
                            <div>
                                <button onclick="editAccount('${acc.device_id}')" style="margin-right: 5px;">Edit</button>
                                <button class="danger" onclick="removeAccount('${acc.device_id}')">Remove</button>
                            </div>
                        </div>
                        <div class="account-details">
                            <div><strong>Today's Proof:</strong><br>${proofText}</div>
                            <div><strong>Last Seen:</strong><br>${data.status && data.status.last_seen ? new Date(data.status.last_seen).toLocaleString() : 'Never'}</div>
                        </div>
                        <div class="logs-box">
                            ${logsHtml}
                        </div>
                    </div>
                `;
            }
        }

        async function saveAccount() {
            if (!window.electronAPI) return;
            const account = {
                device_id: document.getElementById('deviceId').value.trim(),
                upm_username: document.getElementById('upmUsername').value.trim(),
                upm_password: document.getElementById('upmPassword').value,
                supabase_email: document.getElementById('supabaseEmail').value.trim(),
                supabase_password: document.getElementById('supabasePassword').value,
            };
            if (!account.device_id) return alert('Device ID is required!');
            
            await window.electronAPI.saveHubAccount(account);
            alert('Account saved! Please restart the Hub app for the listener to initialize.');
            document.getElementById('deviceId').value = '';
            document.getElementById('upmUsername').value = '';
            document.getElementById('upmPassword').value = '';
            document.getElementById('supabaseEmail').value = '';
            document.getElementById('supabasePassword').value = '';
            switchTab('accounts');
        }

        async function editAccount(deviceId) {
            if (!window.electronAPI) return;
            const accounts = await window.electronAPI.getHubAccounts();
            const account = accounts.find(a => a.device_id === deviceId);
            if (account) {
                document.getElementById('deviceId').value = account.device_id || '';
                document.getElementById('upmUsername').value = account.upm_username || '';
                document.getElementById('upmPassword').value = account.upm_password || '';
                document.getElementById('supabaseEmail').value = account.supabase_email || '';
                document.getElementById('supabasePassword').value = account.supabase_password || '';
                switchTab('add');
            }
        }

        async function removeAccount(deviceId) {
            if (confirm('Are you sure you want to remove ' + deviceId + '?')) {
                await window.electronAPI.removeHubAccount(deviceId);
                loadAccounts();
                alert('Account removed! Please restart the Hub app.');
            }
        }

        async function loadGlobalSettings() {
            if (!window.electronAPI) return;
            const config = await window.electronAPI.getDeviceConfig();
            document.getElementById('supabaseUrl').value = config.supabase_url || '';
            document.getElementById('supabaseKey').value = config.supabase_key || '';
        }

        async function saveGlobalSettings() {
            if (!window.electronAPI) return;
            await window.electronAPI.saveDeviceConfig({
                supabase_url: document.getElementById('supabaseUrl').value.trim(),
                supabase_key: document.getElementById('supabaseKey').value.trim()
            });
            alert('Global settings saved!');
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAccounts();
            loadGlobalSettings();
        });
    </script>
</body>
</html>
